plugins { id 'com.android.application' }
android {
    namespace 'com.irvanputra.jevmoderator'
    compileSdk 34
    defaultConfig {
        applicationId 'com.irvanputra.jevmoderator'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "0.4.2"
        ndk { abiFilters 'arm64-v8a' }
    }
    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
